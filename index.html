<title>Lịch Hẹn Nhóm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: pixel-art scene on top, then two tabs (my hours / group heatmap). Hard borders and offset shadows echo the sprite look. */
:root {
  --bg: #e9f3fb;
  --panel: #ffffff;
  --soft: #eef4fa;
  --ink: #1d2744;
  --muted: #55648a;
  --edge: #1d2744;
  --shadow: #b9cde2;
  --accent: #2f6fd6;
  --accent-ink: #ffffff;
  --free: #35b862;
  --free-ink: #0b2e18;
  --maybe: #f2c230;
  --maybe-ink: #3f3000;
  --busy: #e6edf6;
  --gold: #f0a800;
  --h1: #cdeed8; --h2: #97dfae; --h3: #5cc980; --h4: #2fb15c;
  --h-ink-lo: #1d2744; --h-ink-hi: #0b2e18;
  --c-ha: #e0457b; --c-vy: #e8892b; --c-nhi: #7a4fd6; --c-duyen: #17a0b2;
  --font-d: 'Pixelify Sans', 'Courier New', monospace;
  --font-b: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11162d; --panel: #1a2144; --soft: #232b57; --ink: #e9edff; --muted: #9ba7d2;
    --edge: #4a58a0; --shadow: #0a0e22; --accent: #6ea2ff; --accent-ink: #0b1230;
    --free: #3fc76f; --free-ink: #04210f; --maybe: #f2c94c; --maybe-ink: #2f2400;
    --busy: #252d5a; --gold: #ffcf4a;
    --h1: #1f4a46; --h2: #2a7a5c; --h3: #37a56f; --h4: #4ccf88;
    --h-ink-lo: #e9edff; --h-ink-hi: #04201a;
    --c-ha: #ff6b9c; --c-vy: #ffa34d; --c-nhi: #a583ff; --c-duyen: #3ccbdc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11162d; --panel: #1a2144; --soft: #232b57; --ink: #e9edff; --muted: #9ba7d2;
  --edge: #4a58a0; --shadow: #0a0e22; --accent: #6ea2ff; --accent-ink: #0b1230;
  --free: #3fc76f; --free-ink: #04210f; --maybe: #f2c94c; --maybe-ink: #2f2400;
  --busy: #252d5a; --gold: #ffcf4a;
  --h1: #1f4a46; --h2: #2a7a5c; --h3: #37a56f; --h4: #4ccf88;
  --h-ink-lo: #e9edff; --h-ink-hi: #04201a;
  --c-ha: #ff6b9c; --c-vy: #ffa34d; --c-nhi: #a583ff; --c-duyen: #3ccbdc;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-b); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
}
.wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-d); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: clamp(1.7rem, 5.5vw, 2.4rem); line-height: 1.1; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.scene {
  display: block; width: 100%; aspect-ratio: 200 / 72; image-rendering: pixelated;
  border: 3px solid var(--edge); box-shadow: 5px 5px 0 var(--shadow); background: var(--soft);
}
.head { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-family: var(--font-d); font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sub { color: var(--muted); max-width: 60ch; }

.panel { background: var(--panel); border: 3px solid var(--edge); box-shadow: 4px 4px 0 var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.note { border: 3px dashed var(--edge); padding: 8px 12px; color: var(--muted); font-size: .9rem; background: var(--soft); }

.btn, .chip, .tab, .seg button {
  font-weight: 700; border: 3px solid var(--edge); background: var(--panel); color: var(--ink);
  cursor: pointer; border-radius: 0; box-shadow: 3px 3px 0 var(--shadow); min-height: 44px; padding: 6px 14px;
}
.btn:active, .chip:active, .tab:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.btn.primary, .chip.on, .tab.on, .seg button.on { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { box-shadow: none; background: transparent; }
.btn.danger-arm { background: var(--maybe); color: var(--maybe-ink); }
.chip { min-height: 40px; padding: 4px 12px; font-size: .92rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
.lbl { font-family: var(--font-d); font-size: .95rem; min-width: 84px; color: var(--muted); }
.seg { display: flex; }
.seg button { box-shadow: none; margin-left: -3px; }
.seg button:first-child { margin-left: 0; }
.seg button.on { position: relative; z-index: 1; }
select {
  font: 700 .95rem var(--font-b); color: var(--ink); background: var(--panel);
  border: 3px solid var(--edge); border-radius: 0; min-height: 44px; padding: 4px 8px;
}

.final {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--gold); color: #2a1d00; border: 3px solid var(--edge); box-shadow: 4px 4px 0 var(--shadow); padding: 12px 14px;
}
.final strong { font-family: var(--font-d); font-size: 1.2rem; }
.final .btn { background: #fff7d6; color: #2a1d00; }

.tabs { display: flex; gap: 10px; }
.tab { flex: 1; font-family: var(--font-d); font-size: 1.05rem; }

.people { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.person {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; min-width: 0;
  border: 3px solid var(--edge); background: var(--panel); box-shadow: 3px 3px 0 var(--shadow); padding: 8px 10px; cursor: pointer; border-radius: 0;
}
.person.on { background: var(--soft); outline: 4px solid var(--pc); outline-offset: -4px; }
.ava { width: 28px; height: 28px; background: var(--pc); color: #fff; font-family: var(--font-d); font-weight: 700; display: grid; place-items: center; border: 2px solid var(--edge); }
.pn { font-weight: 700; overflow-wrap: anywhere; line-height: 1.15; }
.pc { font-size: .8rem; color: var(--muted); }

.daystrip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 4px 10px 2px; scroll-snap-type: x proximity; }
.day {
  flex: 0 0 auto; min-width: 66px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; gap: 0;
  border: 3px solid var(--edge); background: var(--panel); box-shadow: 3px 3px 0 var(--shadow); padding: 4px 6px; cursor: pointer; border-radius: 0; min-height: 60px;
}
.day b { font-family: var(--font-d); font-size: 1rem; }
.day span { font-size: .8rem; }
.day small { font-size: .72rem; color: var(--muted); }
.day.we b { color: var(--c-ha); }
.day.on { background: var(--accent); color: var(--accent-ink); }
.day.on b, .day.on small { color: var(--accent-ink); }

.grp { display: flex; flex-direction: column; gap: 8px; }
.grp-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.grp-head h3 small { font-family: var(--font-b); font-weight: 600; font-size: .8rem; color: var(--muted); margin-left: 6px; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
.cell {
  min-height: 52px; border: 3px solid var(--edge); background: var(--busy); color: var(--ink);
  font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; cursor: pointer; border-radius: 0; padding: 2px;
}
.cell small { font-size: .7rem; font-weight: 700; min-height: 1em; }
.cell.s1 { background: var(--free); color: var(--free-ink); }
.cell.s2 { background: var(--maybe); color: var(--maybe-ink); }

.sugs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.sug { border: 3px solid var(--edge); background: var(--soft); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sug.best { border-color: var(--gold); box-shadow: 3px 3px 0 var(--gold); }
.sug .when { font-family: var(--font-d); font-size: 1.1rem; }
.badge { align-self: flex-start; font-weight: 700; font-size: .82rem; padding: 2px 8px; background: var(--free); color: var(--free-ink); border: 2px solid var(--edge); }
.badge.mid { background: var(--maybe); color: var(--maybe-ink); }
.miss { font-size: .85rem; color: var(--muted); }

.heatwrap { overflow-x: auto; border: 3px solid var(--edge); background: var(--panel); box-shadow: 4px 4px 0 var(--shadow); }
table.heat { border-collapse: separate; border-spacing: 3px; width: max-content; min-width: 100%; }
.heat th { font-family: var(--font-d); font-weight: 700; font-size: .85rem; padding: 2px 4px; white-space: nowrap; }
.heat thead th { color: var(--muted); }
.heat thead th.per { border-bottom: 3px solid var(--edge); text-align: left; padding-left: 6px; }
.heat tbody th { position: sticky; left: 0; z-index: 2; background: var(--panel); text-align: left; padding-right: 10px; }
.heat tbody th.we { color: var(--c-ha); }
.heat thead th:first-child { position: sticky; left: 0; background: var(--panel); z-index: 2; }
.heat td { padding: 0; }
.hc {
  position: relative; width: 36px; height: 36px; display: grid; place-items: center; border: 2px solid transparent; background: var(--soft);
  font-weight: 700; font-size: .9rem; color: var(--h-ink-lo); cursor: pointer; border-radius: 0; padding: 0;
}
.hc.h1 { background: var(--h1); } .hc.h2 { background: var(--h2); }
.hc.h3 { background: var(--h3); color: var(--h-ink-hi); } .hc.h4 { background: var(--h4); color: var(--h-ink-hi); }
.hc.h0 { color: var(--muted); font-weight: 600; }
.hc.all { border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); }
.hc.fin { outline: 3px solid var(--gold); outline-offset: 1px; }
.hc.sel { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--panel); }
.hc .mb { position: absolute; right: 2px; top: 2px; width: 7px; height: 7px; background: var(--maybe); border: 1px solid var(--edge); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: .85rem; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--edge); vertical-align: -4px; margin-right: 5px; }

.detail ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.detail li { display: flex; align-items: center; gap: 8px; border: 3px solid var(--edge); padding: 6px 8px; background: var(--soft); min-width: 0; }
.st { margin-left: auto; font-size: .82rem; font-weight: 700; padding: 1px 8px; border: 2px solid var(--edge); white-space: nowrap; }
.st.s1 { background: var(--free); color: var(--free-ink); }
.st.s2 { background: var(--maybe); color: var(--maybe-ink); }
.st.s0 { background: var(--busy); }
.empty { color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--ink); color: var(--bg); font-weight: 700; padding: 10px 16px; border: 3px solid var(--edge); max-width: calc(100vw - 32px);
}

@media (max-width: 560px) {
  .people { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lbl { min-width: 100%; }
  .panel { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .btn:active, .chip:active, .tab:active { transform: none; }
}
</style>

<div class="wrap">
  <canvas id="scene" class="scene" width="200" height="72" role="img" aria-label="Cảnh pixel art: bốn bạn đứng dưới cầu vồng bên cạnh cái cây và cái ao"></canvas>

  <header class="head">
    <div class="eyebrow">Hà · Vy · Nhi Trần · Duyên Bùi</div>
    <h1>Khi nào cả nhóm rảnh?</h1>
    <p class="sub">Mỗi bạn chọn tên mình rồi chạm vào các giờ rảnh trong 14 ngày tới. Tab “Xem cả nhóm” tự tìm giờ nhiều người rảnh nhất.</p>
  </header>

  <div id="app"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function () {
  'use strict';

  /* ---------- constants ---------- */
  var H0 = 6, H1 = 22, NH = 17;
  var HOURS = []; for (var hh = H0; hh <= H1; hh++) HOURS.push(hh);
  var PEOPLE = [
    { id: 'ha', name: 'Hà', color: '--c-ha' },
    { id: 'vy', name: 'Vy', color: '--c-vy' },
    { id: 'nhi', name: 'Nhi Trần', color: '--c-nhi' },
    { id: 'duyen', name: 'Duyên Bùi', color: '--c-duyen' }
  ];
  var PERIODS = [
    { id: 'sang', name: 'Sáng', from: 6, to: 11 },
    { id: 'trua', name: 'Trưa', from: 11, to: 14 },
    { id: 'chieu', name: 'Chiều', from: 14, to: 18 },
    { id: 'toi', name: 'Tối', from: 18, to: 23 }
  ];
  var LONG = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
  var SHORT = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  var STATUS = ['Không rảnh', 'Rảnh', 'Có thể'];

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  var DAYS = [];
  (function () {
    var base = new Date(); base.setHours(0, 0, 0, 0);
    for (var i = 0; i < 14; i++) {
      var d = new Date(base); d.setDate(base.getDate() + i);
      DAYS.push({ idx: i, key: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), dow: d.getDay(), dd: d.getDate(), mm: d.getMonth() + 1 });
    }
  })();

  /* ---------- state ---------- */
  var S = {
    me: null, tab: 'toi', day: 0,
    brush: 1, fillDays: 'cur', from: 18, to: 23,
    people: { ha: {}, vy: {}, nhi: {}, duyen: {} },
    final: null, sel: null, confirmClear: false,
    view: { period: 'all', dtype: 'all', dur: 2 },
    note: ''
  };
  var DB = null, dirty = {}, timers = {}, saving = {};

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  S.me = lsGet('lichhen-me');
  if (!PEOPLE.some(function (p) { return p.id === S.me; })) S.me = null;

  /* ---------- data helpers ---------- */
  function getv(id, key, h) {
    var s = S.people[id][key];
    if (!s) return 0;
    var c = s.charAt(h - H0);
    return c === '1' ? 1 : c === '2' ? 2 : 0;
  }
  function setv(id, key, h, v) {
    var p = S.people[id];
    var s = p[key] || new Array(NH + 1).join('0');
    s = s.slice(0, h - H0) + v + s.slice(h - H0 + 1);
    if (/^0+$/.test(s)) delete p[key]; else p[key] = s;
  }
  function cleanSlots(raw) {
    var out = {};
    if (!raw || typeof raw !== 'object') return out;
    DAYS.forEach(function (d) {
      var s = raw[d.key];
      if (typeof s === 'string' && /^[012]+$/.test(s)) out[d.key] = (s + new Array(NH + 1).join('0')).slice(0, NH);
    });
    return out;
  }
  function marked(id) {
    var n = 0;
    DAYS.forEach(function (d) { var s = S.people[id][d.key]; if (s) for (var i = 0; i < s.length; i++) if (s.charAt(i) !== '0') n++; });
    return n;
  }
  function markedDay(id, key) {
    var s = S.people[id][key], n = 0;
    if (s) for (var i = 0; i < s.length; i++) if (s.charAt(i) !== '0') n++;
    return n;
  }
  function saveLocal() {
    lsSet('lichhen-local', JSON.stringify({ people: S.people, final: S.final }));
  }
  function loadLocal() {
    try {
      var o = JSON.parse(lsGet('lichhen-local') || 'null');
      if (o && o.people) PEOPLE.forEach(function (p) { S.people[p.id] = cleanSlots(o.people[p.id]); });
      if (o && o.final) S.final = validFinal(o.final);
    } catch (e) {}
  }
  function validFinal(f) {
    if (!f || typeof f.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(f.date)) return null;
    var a = +f.start, b = +f.end;
    if (!(a >= H0 && b > a && b <= H1 + 1)) return null;
    return { date: f.date, start: a, end: b };
  }

  function persist(id) {
    dirty[id] = true; saveLocal();
    clearTimeout(timers[id]);
    timers[id] = setTimeout(function () { flush(id); }, 500);
  }
  function flush(id) {
    if (!DB) return;
    if (saving[id]) { timers[id] = setTimeout(function () { flush(id); }, 300); return; }
    saving[id] = true;
    var snap = JSON.stringify(S.people[id]);
    DB.doc('avail/' + id).set({ slots: S.people[id], updatedAt: Date.now() }).then(function () {
      if (JSON.stringify(S.people[id]) === snap) dirty[id] = false; else flush(id);
    }).catch(function () {
      toast('Chưa lưu được lên dữ liệu chung. Hỏi chủ trang cấp quyền Contributor nhé.');
    }).then(function () { saving[id] = false; });
  }

  /* ---------- small utils ---------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2600);
  }
  function dayLabel(d) { return LONG[d.dow] + ' ' + d.dd + '/' + d.mm; }
  function labelFromKey(key) {
    var m = key.split('-'); var dt = new Date(+m[0], +m[1] - 1, +m[2]);
    return LONG[dt.getDay()] + ' ' + (+m[2]) + '/' + (+m[1]);
  }
  function periodOf(h) { for (var i = 0; i < PERIODS.length; i++) if (h >= PERIODS[i].from && h < PERIODS[i].to) return PERIODS[i]; return PERIODS[3]; }
  function dayMatches(d, type) {
    if (type === 'wk') return d.dow >= 1 && d.dow <= 5;
    if (type === 'we') return d.dow === 0 || d.dow === 6;
    return true;
  }
  function visibleHours() {
    var p = S.view.period;
    return HOURS.filter(function (h) { return p === 'all' || periodOf(h).id === p; });
  }
  function visibleDays() { return DAYS.filter(function (d) { return dayMatches(d, S.view.dtype); }); }
  function person(id) { return PEOPLE.filter(function (p) { return p.id === id; })[0]; }

  /* ---------- render: my hours ---------- */
  function chip(act, data, label, on) {
    var attrs = ''; for (var k in data) attrs += ' data-' + k + '="' + data[k] + '"';
    return '<button class="chip' + (on ? ' on' : '') + '" data-a="' + act + '"' + attrs + ' data-fk="' + act + '-' + (data.v || '') + '">' + label + '</button>';
  }
  function periodChipOn(p) { return S.from === p.from && S.to === p.to; }

  function renderPeople() {
    return '<div class="people">' + PEOPLE.map(function (p) {
      var n = marked(p.id);
      return '<button class="person' + (S.me === p.id ? ' on' : '') + '" data-a="me" data-id="' + p.id + '" data-fk="me-' + p.id + '" style="--pc:var(' + p.color + ')" aria-pressed="' + (S.me === p.id) + '">' +
        '<span class="ava">' + p.name.charAt(0) + '</span><span class="pn">' + p.name + '</span><span class="pc">' + (n ? n + ' giờ đã chọn' : 'chưa nhập') + '</span></button>';
    }).join('') + '</div>';
  }

  function renderMine() {
    var out = '<section class="panel"><h2>Bạn là ai?</h2>' + renderPeople();
    if (!S.me) out += '<p class="empty">Chọn tên của bạn để bắt đầu tô giờ rảnh.</p>';
    out += '</section>';
    if (!S.me) return out;

    var d = DAYS[S.day];
    var fillDayChips =
      chip('fd', { v: 'cur' }, 'Ngày đang chọn (' + SHORT[d.dow] + ' ' + d.dd + '/' + d.mm + ')', S.fillDays === 'cur') +
      chip('fd', { v: 'all' }, 'Cả 14 ngày', S.fillDays === 'all') +
      chip('fd', { v: 'wk' }, 'Ngày thường', S.fillDays === 'wk') +
      chip('fd', { v: 'we' }, 'Cuối tuần', S.fillDays === 'we');
    var periodChips = PERIODS.map(function (p) { return chip('fp', { v: p.id }, p.name + ' ' + p.from + '–' + p.to + 'h', periodChipOn(p)); }).join('') +
      chip('fp', { v: 'all' }, 'Cả ngày', S.from === H0 && S.to === H1 + 1);

  /* ---------- group computation ---------- */
  function counts(key, h) {
    var free = 0, maybe = 0;
    PEOPLE.forEach(function (p) { var v = getv(p.id, key, h); if (v === 1) free++; else if (v === 2) maybe++; });
    return { free: free, maybe: maybe };
  }
  function windowStatus(id, key, h, D) {
    var has2 = false;
    for (var k = 0; k < D; k++) { var v = getv(id, key, h + k); if (v === 0) return 0; if (v === 2) has2 = true; }
    return has2 ? 2 : 1;
  }
  function suggestions() {
    var D = S.view.dur, hrs = visibleHours(), days = visibleDays(), out = [];
    var now = new Date(), todayKey = DAYS[0].key, nowH = now.getHours();
    days.forEach(function (d) {
      hrs.forEach(function (h) {
        for (var k = 0; k < D; k++) if (hrs.indexOf(h + k) < 0) return;
        if (d.key === todayKey && h <= nowH) return;
        var st = PEOPLE.map(function (p) { return windowStatus(p.id, d.key, h, D); });
        var free = st.filter(function (x) { return x === 1; }).length;
        var maybe = st.filter(function (x) { return x === 2; }).length;
        var score = free + maybe * 0.5;
        if (score < 1) return;
        out.push({ d: d, h: h, st: st, free: free, maybe: maybe, score: score });
      });
    });
    out.sort(function (a, b) { return (b.score - a.score) || (a.d.idx - b.d.idx) || (a.h - b.h); });
    var chosen = [];
    for (var i = 0; i < out.length && chosen.length < 3; i++) {
      var c = out[i];
      if (chosen.some(function (x) { return x.d === c.d && Math.abs(x.h - c.h) < D; })) continue;
      chosen.push(c);
    }
    return chosen;
  }

  /* ---------- actions ---------- */

  function needMe() { if (!S.me) { toast('Chọn tên của bạn trước nhé.'); return true; } return false; }

  function act(a, d) {
    switch (a) {
      case 'tab': location.hash = d.v; S.tab = d.v; break;
      case 'me': S.me = d.id; lsSet('lichhen-me', d.id); break;
      case 'day': S.day = +d.v; break;

      case 'grp':
        if (needMe()) return;
        var p = PERIODS.filter(function (x) { return x.id === d.v; })[0], k2 = DAYS[S.day].key, all1 = true, hh;
        for (hh = p.from; hh < p.to; hh++) if (getv(S.me, k2, hh) !== 1) all1 = false;
        for (hh = p.from; hh < p.to; hh++) setv(S.me, k2, hh, all1 ? 0 : 1);
        persist(S.me); break;
      case 'fd': S.fillDays = d.v; S.confirmClear = false; break;

        if (d.v === 'all') { S.from = H0; S.to = H1 + 1; }
        else { var pp = PERIODS.filter(function (x) { return x.id === d.v; })[0]; S.from = pp.from; S.to = pp.to; }
        break;
      case 'br': S.brush = +d.v; break;
      case 'apply':
        if (needMe()) return;
        var n = 0;
        targetDays().forEach(function (day) { for (var x = S.from; x < S.to; x++) { setv(S.me, day.key, x, S.brush); n++; } });
        persist(S.me); toast(S.brush === 0 ? 'Đã bỏ ' + n + ' giờ.' : 'Đã tô ' + n + ' giờ.'); break;
      case 'clear':

        S.confirmClear = false; S.people[S.me] = {}; persist(S.me); toast('Đã xóa lịch của bạn.'); break;
